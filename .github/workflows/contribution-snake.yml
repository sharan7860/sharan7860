name: Refresh contribution activity visual

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate activity stream
        uses: Platane/snk@v3
        with:
          github_user_name: sharan7860
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%238ef0d3,%23afc7ff,%23c18bf4

      - name: Publish activity stream
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
