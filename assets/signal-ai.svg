<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">01 / Signal AI</title>
  <desc id="desc">AI-assisted market exploration with an animated signal chart. This is an interface illustration, not market data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121B1A"/><stop offset="1" stop-color="#07100E"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132B26" stop-opacity=".88"/><stop offset="1" stop-color="#0B1513" stop-opacity=".7"/></linearGradient>
    <linearGradient id="area" x2="0" y2="1"><stop stop-color="#49E6AC" stop-opacity=".34"/><stop offset="1" stop-color="#49E6AC" stop-opacity="0"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#77FFC4"/><stop offset=".55" stop-color="#3EEBB0"/><stop offset="1" stop-color="#FFCA69"/></linearGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="round"><rect width="1280" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect x=".5" y=".5" width="1279" height="239" rx="16" fill="url(#bg)" stroke="#2D4640"/>
    <path d="M0 42H1280" stroke="#6DFFB8" stroke-opacity=".08"/>
    <rect y="42" width="4" height="155" rx="2" fill="#5AFFAB" filter="url(#glow)"/>

    <!-- quiet signal particles -->
    <g fill="#72FFC0" opacity=".38"><circle cx="601" cy="45" r="2"><animate attributeName="opacity" values=".05;.8;.05" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="1146" cy="76" r="2"><animate attributeName="opacity" values=".1;.7;.1" dur="3.6s" repeatCount="indefinite"/></circle><circle cx="1068" cy="206" r="1.5"><animate attributeName="opacity" values=".1;.8;.1" dur="2.1s" repeatCount="indefinite"/></circle><circle cx="728" cy="214" r="1.5"><animate attributeName="opacity" values=".1;.7;.1" dur="4s" repeatCount="indefinite"/></circle></g>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="44" y="53" fill="#70FFB9" font-size="16" letter-spacing="3">01 / AI + DATA</text>
      <text x="42" y="120" fill="#F1FFF8" font-size="52" font-weight="700" letter-spacing="-1.5">Signal AI</text>
      <text x="44" y="164" fill="#BFDBD0" font-size="23">AI-assisted market exploration.</text>
      <text x="44" y="208" fill="#82A99A" font-size="15" letter-spacing="1.5">TYPESCRIPT / REACT / PYTHON</text>
      <rect x="265" y="29" width="148" height="27" rx="13.5" fill="#123126" stroke="#58FCAF" stroke-opacity=".4"/>
      <circle cx="282" cy="42.5" r="4" fill="#60FFB1" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/></circle>
      <text x="294" y="47" fill="#A2F7C7" font-size="11" font-weight="700" letter-spacing="1.3">SIGNALS LIVE</text>
    </g>

    <!-- live market dashboard -->
    <g transform="translate(681 28)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
      <rect width="470" height="184" rx="13" fill="url(#card)" stroke="#51DFA4" stroke-opacity=".35"/>
      <path d="M0 34H470" stroke="#6AFFB5" stroke-opacity=".15"/>
      <circle cx="22" cy="17" r="4" fill="#5AFFAB"/><text x="37" y="21" fill="#B6EFD1" font-size="11" letter-spacing="1.4">SIGNAL.AI / MARKET PULSE</text>
      <text x="438" y="21" text-anchor="end" fill="#FFD382" font-size="10">LIVE</text>
      <g transform="translate(26 49)" stroke="#80DAB4" stroke-opacity=".13"><path d="M0 0H415M0 30H415M0 60H415M0 90H415M0 120H415M42 0V120M126 0V120M210 0V120M294 0V120M378 0V120"/></g>
      <path d="M26 154 67 129 105 138 147 87 188 111 229 64 271 92 312 42 352 62 394 28 441 39V169H26Z" fill="url(#area)"/>
      <path d="M26 154 67 129 105 138 147 87 188 111 229 64 271 92 312 42 352 62 394 28 441 39" stroke="url(#line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="560" stroke-dashoffset="560"><animate attributeName="stroke-dashoffset" values="560;0;0;560" dur="7s" repeatCount="indefinite"/></path>
      <g stroke-width="2">
        <path d="M72 111V147M66 120H78V139H66Z" stroke="#64E9AE"/><path d="M121 101V137M115 109H127V129H115Z" stroke="#FFBE68"/><path d="M173 70V112M167 78H179V102H167Z" stroke="#67F0B2"/><path d="M254 64V104M248 71H260V94H248Z" stroke="#63EFAE"/><path d="M337 45V82M331 54H343V74H331Z" stroke="#6BFAB7"/><path d="M405 26V62M399 34H411V53H399Z" stroke="#72FFBD"/></g>
      <circle cx="441" cy="39" r="5.5" fill="#FFE0A2" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/></circle>
      <path d="M26 173H441" stroke="#75FFBC" stroke-opacity=".16"/>
      <text x="26" y="181" fill="#7DCAA0" font-size="10">AI CONFIDENCE</text><text x="441" y="181" text-anchor="end" fill="#8FFFC4" font-size="10">89.4%</text>
      <rect x="121" y="176" width="188" height="4" rx="2" fill="#173B2D"/><rect x="121" y="176" width="168" height="4" rx="2" fill="#58F9AB"><animate attributeName="width" values="130;176;151;168;130" dur="5s" repeatCount="indefinite"/></rect>
    </g>
    <path d="M1210 42h24v24m-25-1 24-23" stroke="#69FFB5" stroke-width="2"/>
  </g>
</svg>
