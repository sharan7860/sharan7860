    <radialGradient id="glow"><stop stop-color="#D89045" stop-opacity=".16"/><stop offset="1" stop-color="#D89045" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
    <clipPath id="round"><rect width="1280" height="520" rx="24"/></clipPath>
  </defs>
