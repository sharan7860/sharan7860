<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sharan Kumar — creative developer</title>
  <desc id="desc">A charcoal and amber portfolio banner with a geometric orbital sculpture. AI, data, and the art of building for the web.</desc>
  <defs>
