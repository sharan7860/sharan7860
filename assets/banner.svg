      <path d="M82 50H73V57H82V64H73" stroke="#031008" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="109" y="62" fill="#E7FFF0" font-size="17" font-weight="700" letter-spacing="2">SHARAN / SYSTEM ROOT</text>
      <text x="1216" y="61" text-anchor="end" fill="#91CFA9" font-size="14" letter-spacing="2">NEURAL LINK: ACTIVE</text>
      <text x="64" y="155" fill="#67FFAB" font-size="16" letter-spacing="4">AI DEVELOPER // CREATIVE CODER</text>
      <text x="58" y="260" fill="#F1FFF6" font-size="104" font-weight="800" letter-spacing="-5">Sharan</text>
      <text x="58" y="363" fill="#F1FFF6" font-size="104" font-weight="800" letter-spacing="-5">Kumar<tspan fill="#55FA9A">.</tspan></text>
      <text x="64" y="413" fill="#B9EBCB" font-size="23">AI, data, and the art of building for the web.</text>
      <text x="64" y="477" fill="#7DBC93" font-size="14" letter-spacing="2">&gt; EXPLORE. BUILD. REFINE._<animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/></text>
      <text x="1216" y="477" text-anchor="end" fill="#7DBC93" font-size="14" letter-spacing="2">@SHARAN7860 / ONLINE</text>
