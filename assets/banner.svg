<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sharan Kumar — AI developer</title>
  <desc id="desc">A refined Matrix-inspired AI developer banner with a glowing terminal, code rain, and animated neural signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020604"/><stop offset=".52" stop-color="#071A10"/><stop offset="1" stop-color="#010403"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0E291A" stop-opacity=".88"/><stop offset="1" stop-color="#061008" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9BFFD0"/><stop offset=".4" stop-color="#3BFF9B"/><stop offset="1" stop-color="#0B9B52"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#44FFA0" stop-opacity=".27"/><stop offset=".43" stop-color="#119B57" stop-opacity=".13"/><stop offset="1" stop-color="#119B57" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#76FFC0" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1280" height="520" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="520" fill="url(#bg)"/>
    <rect width="1280" height="520" fill="url(#grid)"/>
    <circle cx="1000" cy="258" r="390" fill="url(#halo)"/>
    <path d="M0 92H1280" stroke="#74FFB6" stroke-opacity=".22"/>
    <path d="M0 93H1280" stroke="#57FFA7" stroke-opacity=".12"><animate attributeName="stroke-opacity" values=".05;.4;.05" dur="3s" repeatCount="indefinite"/></path>

    <!-- Matrix rain stays delicate so the terminal remains readable. -->
    <g fill="#66FFAD" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2" text-anchor="middle">
      <text x="618" y="-82" fill-opacity=".22">01<tspan x="618" dy="21">10</tspan><tspan x="618" dy="21">AI</tspan><tspan x="618" dy="21">01</tspan><tspan x="618" dy="21">11</tspan><tspan x="618" dy="21">//</tspan><tspan x="618" dy="21">10</tspan><tspan x="618" dy="21">01</tspan><tspan x="618" dy="21">AI</tspan><tspan x="618" dy="21">11</tspan><tspan x="618" dy="21">01</tspan><tspan x="618" dy="21">10</tspan><tspan x="618" dy="21">//</tspan><tspan x="618" dy="21">01</tspan><tspan x="618" dy="21">11</tspan><tspan x="618" dy="21">AI</tspan><animateTransform attributeName="transform" type="translate" values="0 -70;0 650" dur="12s" repeatCount="indefinite"/></text>
      <text x="702" y="-215" fill-opacity=".17">NODE<tspan x="702" dy="21">01</tspan><tspan x="702" dy="21">10</tspan><tspan x="702" dy="21">//</tspan><tspan x="702" dy="21">AI</tspan><tspan x="702" dy="21">11</tspan><tspan x="702" dy="21">01</tspan><tspan x="702" dy="21">10</tspan><tspan x="702" dy="21">01</tspan><tspan x="702" dy="21">AI</tspan><tspan x="702" dy="21">//</tspan><tspan x="702" dy="21">10</tspan><tspan x="702" dy="21">01</tspan><tspan x="702" dy="21">11</tspan><tspan x="702" dy="21">AI</tspan><tspan x="702" dy="21">01</tspan><tspan x="702" dy="21">10</tspan><tspan x="702" dy="21">//</tspan><animateTransform attributeName="transform" type="translate" values="0 -140;0 760" dur="16s" repeatCount="indefinite"/></text>
      <text x="1156" y="-130" fill-opacity=".27">10<tspan x="1156" dy="21">01</tspan><tspan x="1156" dy="21">AI</tspan><tspan x="1156" dy="21">//</tspan><tspan x="1156" dy="21">11</tspan><tspan x="1156" dy="21">01</tspan><tspan x="1156" dy="21">10</tspan><tspan x="1156" dy="21">AI</tspan><tspan x="1156" dy="21">01</tspan><tspan x="1156" dy="21">//</tspan><tspan x="1156" dy="21">11</tspan><tspan x="1156" dy="21">01</tspan><tspan x="1156" dy="21">10</tspan><tspan x="1156" dy="21">AI</tspan><tspan x="1156" dy="21">//</tspan><tspan x="1156" dy="21">01</tspan><tspan x="1156" dy="21">11</tspan><animateTransform attributeName="transform" type="translate" values="0 -100;0 690" dur="10.5s" repeatCount="indefinite"/></text>
      <text x="1212" y="-356" fill-opacity=".12">01<tspan x="1212" dy="21">11</tspan><tspan x="1212" dy="21">//</tspan><tspan x="1212" dy="21">AI</tspan><tspan x="1212" dy="21">10</tspan><tspan x="1212" dy="21">01</tspan><tspan x="1212" dy="21">11</tspan><tspan x="1212" dy="21">10</tspan><tspan x="1212" dy="21">AI</tspan><tspan x="1212" dy="21">//</tspan><tspan x="1212" dy="21">01</tspan><tspan x="1212" dy="21">11</tspan><tspan x="1212" dy="21">AI</tspan><tspan x="1212" dy="21">10</tspan><tspan x="1212" dy="21">//</tspan><tspan x="1212" dy="21">01</tspan><tspan x="1212" dy="21">11</tspan><tspan x="1212" dy="21">AI</tspan><tspan x="1212" dy="21">10</tspan><animateTransform attributeName="transform" type="translate" values="0 -250;0 890" dur="18s" repeatCount="indefinite"/></text>
    </g>

    <!-- Header -->
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="62" y="39" width="178" height="36" rx="18" fill="#0D2619" stroke="#62FFAD" stroke-opacity=".35"/>
      <circle cx="83" cy="57" r="5" fill="#57FFA7" filter="url(#soft)"><animate attributeName="opacity" values=".35;1;.35" dur="1.7s" repeatCount="indefinite"/></circle>
      <text x="98" y="62" fill="#D9FFE9" font-size="13" font-weight="700" letter-spacing="1.7">SYSTEM ONLINE</text>
      <text x="1216" y="62" text-anchor="end" fill="#8EC9A5" font-size="13" letter-spacing="2">SHARAN7860 // AI LAB</text>
    </g>

    <!-- Left identity panel -->
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="64" y="151" fill="#66FFAD" font-size="15" font-weight="700" letter-spacing="4">CREATIVE DEVELOPER</text>
      <text x="58" y="257" fill="#F2FFF7" font-size="104" font-weight="800" letter-spacing="-5">Sharan</text>
      <text x="58" y="360" fill="#F2FFF7" font-size="104" font-weight="800" letter-spacing="-5">Kumar<tspan fill="#58FFA8">.</tspan></text>
      <rect x="64" y="389" width="439" height="50" rx="10" fill="#0A1D12" fill-opacity=".77" stroke="#6BFFB2" stroke-opacity=".18"/>
      <circle cx="87" cy="414" r="5" fill="#55FFA6" filter="url(#soft)"/>
      <text x="104" y="419" fill="#C8F8D8" font-size="18">AI, data, and the art of building for the web.</text>
      <text x="64" y="477" fill="#80C49A" font-size="13" letter-spacing="2">&gt; EXPLORE. BUILD. REFINE.<tspan fill="#6BFFB0">_</tspan></text>
    </g>

    <!-- Floating terminal / live visual -->
    <g transform="translate(696 136)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
      <rect width="432" height="244" rx="17" fill="url(#panel)" stroke="url(#edge)" stroke-opacity=".65"/>
      <path d="M0 43H432" stroke="#67FFAD" stroke-opacity=".22"/>
      <circle cx="25" cy="22" r="5" fill="#FF6E7A"/><circle cx="43" cy="22" r="5" fill="#FFCA63"/><circle cx="61" cy="22" r="5" fill="#56FFAD"/>
      <text x="88" y="27" fill="#99D9B4" font-size="12" letter-spacing="1.5">sharan@neural-core:~</text>
      <text x="28" y="79" fill="#65FFAC" font-size="13">$</text>
      <text x="47" y="79" fill="#E0FFE9" font-size="13">initialize --creative-ai</text>
      <text x="28" y="110" fill="#5DBF84" font-size="12">[ok] signal.ai interface ready</text>
      <text x="28" y="135" fill="#5DBF84" font-size="12">[ok] portfolio system online</text>
      <text x="28" y="160" fill="#5DBF84" font-size="12">[ok] curiosity engine running</text>
      <path d="M28 185H404" stroke="#6AFFAC" stroke-opacity=".16"/>
      <text x="28" y="214" fill="#6BFFB0" font-size="12" letter-spacing="1.2">BUILDING THE NEXT SIGNAL</text>
      <rect x="337" y="202" width="52" height="18" rx="9" fill="#153E26" stroke="#55FFA6" stroke-opacity=".55"/>
      <text x="363" y="215" text-anchor="middle" fill="#7CFFBA" font-size="10">LIVE</text>
      <rect x="47" y="68" width="2" height="14" fill="#71FFB3"><animate attributeName="opacity" values="0;0;1;1;0" dur="1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- Neural signal object -->
    <g transform="translate(1059 410)">
      <path d="M-168 0H168M0-99V99" stroke="#77FFBA" stroke-opacity=".16"/>
      <circle r="90" stroke="#6CFFB4" stroke-opacity=".26" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="28s" repeatCount="indefinite"/></circle>
      <circle r="62" stroke="#4DEA90" stroke-opacity=".3"/>
      <g fill="none" stroke="url(#edge)" stroke-width="1.5">
        <ellipse rx="104" ry="31" transform="rotate(-35)"/>
        <ellipse rx="104" ry="47" transform="rotate(-35)"/>
        <ellipse rx="104" ry="63" transform="rotate(-35)"/>
        <ellipse rx="104" ry="79" transform="rotate(-35)"/>
        <ellipse rx="104" ry="95" transform="rotate(-35)"/>
      </g>
      <circle r="28" fill="#07170E" stroke="#66FFAC" stroke-opacity=".8" filter="url(#soft)"/>
      <path d="m-10-8-9 8 9 8m20-16 9 8-9 8M4-13-4 13" stroke="#D7FFEA" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-63" cy="-63" r="5" fill="#91FFC6" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="76" cy="40" r="4" fill="#4CFFA1" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/></circle>
    </g>
    <text x="1216" y="477" text-anchor="end" fill="#80C49A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1.5">NEURAL LINK / 100%</text>
  </g>
</svg>
