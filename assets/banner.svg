      <text x="783" y="-230" fill-opacity=".22">10 01<tspan x="783" dy="24">010101</tspan><tspan x="783" dy="24">// 101</tspan><tspan x="783" dy="24">110010</tspan><tspan x="783" dy="24">AI / 01</tspan><tspan x="783" dy="24">010101</tspan><tspan x="783" dy="24">&lt;code&gt;</tspan><tspan x="783" dy="24">110010</tspan><tspan x="783" dy="24">01 // 10</tspan><tspan x="783" dy="24">010011</tspan><tspan x="783" dy="24">1010 01</tspan><tspan x="783" dy="24">/LINK</tspan><tspan x="783" dy="24">010101</tspan><tspan x="783" dy="24">// 101</tspan><tspan x="783" dy="24">110010</tspan><tspan x="783" dy="24">AI / 01</tspan><animateTransform attributeName="transform" type="translate" values="0 -160;0 720" dur="12.5s" repeatCount="indefinite"/></text>
      <text x="1085" y="-126" fill-opacity=".31">0101<tspan x="1085" dy="24">// AI</tspan><tspan x="1085" dy="24">1010</tspan><tspan x="1085" dy="24">&lt;/&gt;</tspan><tspan x="1085" dy="24">0110</tspan><tspan x="1085" dy="24">1011</tspan><tspan x="1085" dy="24">01 01</tspan><tspan x="1085" dy="24">/SYS</tspan><tspan x="1085" dy="24">1100</tspan><tspan x="1085" dy="24">0101</tspan><tspan x="1085" dy="24">1010</tspan><tspan x="1085" dy="24">// 01</tspan><tspan x="1085" dy="24">0110</tspan><tspan x="1085" dy="24">1100</tspan><animateTransform attributeName="transform" type="translate" values="0 -120;0 620" dur="9s" repeatCount="indefinite"/></text>
      <text x="1177" y="-310" fill-opacity=".16">11 01<tspan x="1177" dy="24">0101</tspan><tspan x="1177" dy="24">AI//</tspan><tspan x="1177" dy="24">1010</tspan><tspan x="1177" dy="24">/SYS</tspan><tspan x="1177" dy="24">0110</tspan><tspan x="1177" dy="24">1101</tspan><tspan x="1177" dy="24">01 10</tspan><tspan x="1177" dy="24">1010</tspan><tspan x="1177" dy="24">//AI</tspan><tspan x="1177" dy="24">0101</tspan><tspan x="1177" dy="24">1011</tspan><tspan x="1177" dy="24">&lt;/&gt;</tspan><tspan x="1177" dy="24">0110</tspan><tspan x="1177" dy="24">1100</tspan><tspan x="1177" dy="24">0101</tspan><tspan x="1177" dy="24">AI//</tspan><animateTransform attributeName="transform" type="translate" values="0 -240;0 800" dur="13.5s" repeatCount="indefinite"/></text>
    </g>
    <rect x="574" y="92" width="3" height="390" fill="url(#scan)" opacity=".7"><animate attributeName="x" values="574;1230;574" dur="8.5s" repeatCount="indefinite"/></rect>
    <circle cx="1000" cy="266" r="345" fill="url(#glow)"/>

