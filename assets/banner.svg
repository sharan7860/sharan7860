        <ellipse rx="174" ry="79" transform="rotate(-45)"/>
        <ellipse rx="174" ry="98" transform="rotate(-45)"/>
        <ellipse rx="174" ry="118" transform="rotate(-45)"/>
        <ellipse rx="174" ry="137" transform="rotate(-45)"/>
        <ellipse rx="174" ry="154" transform="rotate(-45)"/>
