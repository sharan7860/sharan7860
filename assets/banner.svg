      <path d="m-16-12-13 12 13 12m32-24 13 12-13 12M6-19-6 19" stroke="#C7FFDA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-109" cy="-109" r="7" fill="#8BFFBD" filter="url(#softGlow)"><animate attributeName="r" values="5;8;5" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="135" cy="77" r="6" fill="#41E88A" filter="url(#softGlow)"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle>
