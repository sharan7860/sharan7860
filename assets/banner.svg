<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sharan Kumar — AI developer</title>
  <desc id="desc">A neon green Matrix-inspired portfolio banner with animated code rain, terminal details, and a scanning orbital interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#020705"/><stop offset=".55" stop-color="#06130D"/><stop offset="1" stop-color="#010403"/></linearGradient>
    <linearGradient id="orbit" x1="-174" y1="-174" x2="174" y2="174" gradientUnits="userSpaceOnUse"><stop stop-color="#E0FFE9"/><stop offset=".48" stop-color="#58F29A"/><stop offset="1" stop-color="#10B86A"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#21E981" stop-opacity=".24"/><stop offset=".46" stop-color="#0C9B56" stop-opacity=".11"/><stop offset="1" stop-color="#0C9B56" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#63FFAB" stop-opacity="0"/><stop offset=".48" stop-color="#63FFAB" stop-opacity=".75"/><stop offset="1" stop-color="#63FFAB" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#73F0B6" stroke-opacity=".055"/></pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="round"><rect width="1280" height="520" rx="24"/></clipPath>
  </defs>
